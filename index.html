<script>

/* ====== ✅ 防刷 + 锁定增强（在你原 verifyAndUnlock 上增强）====== */

function getLockMinutes(l){
  if(l===1)return 3;
  if(l===2)return 6;
  return 9;
}

let tryCount=0,lockLevel=0,lockUntil=0;

/* ====== ✅ 验证码使用记录 ====== */
function isCodeUsed(c){
  let a=JSON.parse(localStorage.getItem('hehun_used_list')||'[]');
  return a.includes(c);
}
function markCodeUsed(c){
  let a=JSON.parse(localStorage.getItem('hehun_used_list')||'[]');
  a.push(c);
  localStorage.setItem('hehun_used_list',JSON.stringify(a));
}

/* ====== ✅ 核心验证逻辑（增强版）====== */
function verifyAndUnlock(){
  let now=Date.now();
  let input=document.getElementById('verifyCode').value.trim();

  if(now<lockUntil){
    let m=Math.ceil((lockUntil-now)/60000);
    showError('已锁定 '+m+' 分钟');
    return;
  }

  if(!input){
    showError('请输入姻缘凭证');
    return;
  }

  /* 🔐 只允许6位数字 */
  if(/^\d{6}$/.test(input) && !isCodeUsed(input)){
    markCodeUsed(input);
    tryCount=0;
    lockLevel=0;
    lockUntil=0;

    closeQR();
    showScreen('Report');

  }else{
    tryCount++;

    if(tryCount>=3){
      lockLevel++;
      let m=getLockMinutes(lockLevel);
      lockUntil=now + m*60000;
      tryCount=0;
      showError('错误过多，锁定 '+m+' 分钟');
    }else{
      showError('凭证无效，请添加 zs520lwyy 获取');
    }
  }
}

/* ====== ✅ 错误提示统一 ====== */
function showError(msg){
  let el=document.getElementById('qrError');
  el.style.display='block';
  el.textContent=msg;
}

/* ====== ✅ 名字校验增强（不改提示）====== */

function isChineseOnly(s){
  return /^[\u4e00-\u9fa5]+$/.test(s);
}

const BLACKLIST = new Set(['张三','李四','测试','小明','匿名','用户','admin','test']);

function isValidName(n){
  if(!isChineseOnly(n))return false;
  if(n.length<2||n.length>4)return false;
  if(BLACKLIST.has(n))return false;
  if(n.length===2 && n[0]===n[1])return false;
  return true;
}

/* ====== ✅ 防连续点击（防脚本）====== */
let lastClick=0;
function startDivination(){
  let now=Date.now();
  if(now-lastClick<1500){
    showToast('操作过快');
    return;
  }
  lastClick=now;

  /* 👉 下面全部保持你原逻辑 */
}

</script>
