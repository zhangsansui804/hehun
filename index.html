<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合婚测算 · AI缘定三生</title>

<style>
body{margin:0;background:#0C0B1A;color:#F2E9D0;font-family:sans-serif}
.app{max-width:420px;margin:auto;padding:20px}
input,select,button{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:none}
button{background:#C8796C;color:#fff;font-weight:bold}
</style>
</head>

<body>
<div class="app">

<h2>合婚测算</h2>

<input id="myName" placeholder="你的名字">
<input id="taName" placeholder="TA的名字">

<button onclick="startDivination()">开始测算</button>

<p id="result"></p>

</div>

<script>

// ================== 名字验证（加强版） ==================
const BLACKLIST = new Set([
'测试','示例','匿名','无名','游客',
'admin','test','user',
'张三','李四','王五'
]);

function isValidName(n){
if(!/^[\u4e00-\u9fa5]{2,4}$/.test(n)) return false;
if(/(.)\1+/.test(n)) return false;
if(BLACKLIST.has(n)) return false;
return true;
}

// ================== AI防刷 ==================
function canCallAI(){
let last = localStorage.getItem('ai_last')||0;
if(Date.now()-last<10000){
alert('操作过快');
return false;
}
localStorage.setItem('ai_last',Date.now());
return true;
}

// ================== 验证码防爆破 ==================
function checkCode(input){
let lastTry = localStorage.getItem('last_try')||0;
if(Date.now()-lastTry<2000){
alert('太快了');
return false;
}
localStorage.setItem('last_try',Date.now());

return /^\d{6}$/.test(input);
}

// ================== 主逻辑 ==================
function startDivination(){

let my=document.getElementById('myName').value.trim();
let ta=document.getElementById('taName').value.trim();

if(!isValidName(my)||!isValidName(ta)){
alert('姓名不合法');
return;
}

if(!canCallAI()) return;

document.getElementById('result').innerText='AI测算中...';

setTimeout(()=>{
let score=70+Math.floor(Math.random()*30);
document.getElementById('result').innerText=
my+' ❤️ '+ta+' 匹配度：'+score+'%';
},2000);

}

</script>
</body>
</html>
