<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合婚测算</title>

<style>
:root{--bg:#0C0B1A;--gold:#D4AF37;--card:rgba(22,21,45,.65)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#F2E9D0;font-family:sans-serif;display:flex;justify-content:center}
.app{max-width:420px;width:100%}
.screen{display:none;padding:20px}
.screen.active{display:block}
.btn{width:100%;height:50px;border:none;border-radius:25px;background:#C8796C;color:#fff;font-weight:700}
input,select{width:100%;margin:6px 0;padding:10px;background:transparent;border:1px solid #333;color:#fff}
.card{background:var(--card);padding:15px;border-radius:15px;margin:10px 0}
</style>
</head>

<body>
<div class="app">

<!-- 输入 -->
<div class="screen active" id="screenInput">
<div class="card">
<input id="myName" placeholder="你的名字">
<input id="taName" placeholder="TA名字">
</div>
<button class="btn" onclick="start()">开始测算</button>
</div>

<!-- 加载 -->
<div class="screen" id="screenLoading">
<p id="loadingText">正在推算...</p>
</div>

<!-- 结果 -->
<div class="screen" id="screenResult">
<div class="card">
<h3 id="verdict"></h3>
<p id="poem"></p>
</div>
<button class="btn" onclick="openPay()">解锁完整版 ¥28</button>
</div>

</div>

<script>

// ====== 精简黑名单（比你原来小90%但更有效） ======
const badWords=/测试|demo|123|哈哈|随便|admin|test/i;

function validName(n){
return /^[\u4e00-\u9fa5]{2,4}$/.test(n)&&!badWords.test(n)
}

// ====== AI防刷 ======
let lastTime=0;
function canAI(){
let now=Date.now();
if(now-lastTime<8000){
alert("别刷太快");
return false
}
lastTime=now;
return true
}

// ====== 切屏 ======
function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active')
}

// ====== 主流程 ======
function start(){
let a=myName.value.trim();
let b=taName.value.trim();

if(!validName(a)||!validName(b)){
alert("名字不合法");
return
}

if(!canAI())return;

show('screenLoading');

setTimeout(()=>{
let score=70+Math.random()*25|0;
let v=score>85?'天作之合':'缘分尚可';

verdict.innerText=v;

fetch('https://hehun.vercel.app/api/generate',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({name1:a,name2:b})
})
.then(r=>r.json())
.then(d=>{
poem.innerText=d.content||"金风玉露一相逢";
show('screenResult')
})
.catch(()=>{
poem.innerText="缘起缘落，自有天意";
show('screenResult')
})

},3000)
}

// ====== 支付（保留逻辑） ======
function openPay(){
alert("这里放你的二维码逻辑")
}

</script>

</body>
</html>
