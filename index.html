<head>

<title>合婚测算</title>

<style>
body{
  margin:0;
  background:#070b1a;
  font-family:Arial;
  color:#fff;
}

.container{
  max-width:420px;
  margin:100px auto;
  padding:20px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
  background:transparent;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:30px;
  background:#b8766a;
  color:#fff;
  font-size:18px;
}
</style>
</head>

<body>

<div class="container">
  <input id="name1" placeholder="你的名字">
  <input id="name2" placeholder="TA名字">
  <button onclick="checkNamesAndStart()">开始测算</button>
</div>

<script>
// ====== 黑名单 ======
const blacklist = [
  "测试","test","123","aaa","名字","随便","未知",
  "sb","SB","傻逼","admin","管理员"
];

// 黑名单检测
function isBlacklisted(name){
  return blacklist.some(b => name.toLowerCase().includes(b.toLowerCase()));
}

// 名字规则
function isValidName(name){
  name = name.trim();

  if(name.length < 2 || name.length > 8) return false;

  const reg = /^[\u4e00-\u9fa5·]{2,8}$/;
  return reg.test(name);
}


// ====== 点击按钮 ======
function checkNamesAndStart(){
  const userName = document.getElementById("name1").value;
  const targetName = document.getElementById("name2").value;

  if(
    !isValidName(userName) ||
    !isValidName(targetName) ||
    isBlacklisted(userName) ||
    isBlacklisted(targetName)
  ){
    alert("名字不合法");
    return;
  }

  // ✅ 通过后执行原逻辑
  startMatch(userName, targetName);
}

  alert("校验通过，开始调用AI");
}
</script>

</body>
</html>
