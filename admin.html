<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 · 随机一次性验证码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C0B1A;color:#F2E9D0;font-family:'PingFang SC','Hiragino Sans GB',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;flex-direction:column;overflow:hidden}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;background:#D4AF37;border-radius:50%;animation:twinkle linear infinite;opacity:0}
@keyframes twinkle{0%{opacity:0;transform:scale(.5)}50%{opacity:.8;transform:scale(1.2)}100%{opacity:0;transform:scale(.5)}}
h1{color:#D4AF37;font-size:20px;letter-spacing:6px;margin-bottom:10px}
.code-box{background:rgba(22,21,45,.8);border:2px solid rgba(212,175,55,.3);border-radius:20px;padding:40px 30px;backdrop-filter:blur(20px);margin:20px 0}
.code-label{color:rgba(242,233,208,.5);font-size:12px;letter-spacing:4px;margin-bottom:12px}
.code-value{font-size:52px;letter-spacing:18px;color:#F2E9D0;font-weight:900}
.info-text{color:rgba(242,233,208,.5);font-size:13px;margin-bottom:20px;line-height:1.8}
.btn{background:#C8796C;color:#fff;border:none;padding:14px 30px;border-radius:24px;font-size:15px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 20px rgba(200,121,108,.35);margin:6px}
.btn:active{transform:scale(.96)}
.used-list{max-width:320px;margin:0 auto}
.used-title{color:rgba(242,233,208,.4);font-size:12px;letter-spacing:2px;margin:30px 0 8px}
.used-code{color:rgba(242,233,208,.2);font-size:11px;text-decoration:line-through;margin:2px 0}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<h1>🔒 一次性验证码</h1>
<p class="info-text">每个验证码随机生成，仅可使用一次<br>点击「生成随机码」后把验证码发给付款用户</p>
<div class="code-box"><div class="code-label">当前有效验证码</div><div class="code-value" id="code">------</div></div>
<button class="btn" onclick="generateRandom()">🎲 生成随机码</button>
<button class="btn" onclick="generateCustom()">✏️ 手动输入验证码</button>
<div class="used-list"><div class="used-title">已使用过的验证码：</div><div id="usedList"></div></div>
<script>
(function(){var s=document.getElementById('stars');for(var i=0;i<30;i++){var d=document.createElement('div');d.className='star';d.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:2px;height:2px;animation-delay:'+Math.random()*4+'s;animation-duration:'+(2+Math.random()*4)+'s;';s.appendChild(d)}})();
function getCurrentCode(){return localStorage.getItem('hehun_code')}
function setCurrentCode(c){localStorage.setItem('hehun_code',c)}
function getUsedCodes(){return JSON.parse(localStorage.getItem('hehun_used_list')||'[]')}
function addUsedCode(c){var a=getUsedCodes();a.push(c);if(a.length>30)a.shift();localStorage.setItem('hehun_used_list',JSON.stringify(a))}
function displayCode(){document.getElementById('code').textContent=getCurrentCode()||'------';renderUsed()}
function generateRandom(){var c=String(Math.floor(100000+Math.random()*900000));setCurrentCode(c);displayCode()}
function generateCustom(){var c=prompt('输入新的验证码（6位数字）：','');if(c&&/^\d{6}$/.test(c)){setCurrentCode(c);displayCode()}else if(c){alert('请输入6位纯数字')}}
function renderUsed(){var c=getUsedCodes();document.getElementById('usedList').innerHTML=c.length===0?'<span style="color:rgba(242,233,208,0.2);">暂无</span>':c.slice().reverse().map(function(x){return'<div class="used-code">'+x+'</div>'}).join('')}
displayCode();if(!getCurrentCode()){generateRandom()}
</script>
</body>
</html>
